<!DOCTYPE html>

<head>

<title>George Strait Official Page</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eeeeee;
  color: #222;
}

.profile {
  max-width: 430px;
  min-height: 100vh;
  margin: auto;
  background: white;
  text-align: center;
  box-shadow: 0 0 15px rgba(0,0,0,0.15);
}

.cover {
  height: 180px;
  background: linear-gradient(135deg, #111111, #f5b800);
}

.photo {
  width: 130px;
  height: 130px;
  object-fit: cover;
  border-radius: 50%;
  border: 5px solid white;
  margin-top: -65px;
  background: #ddd;
}

h1 {
  margin: 12px 20px 5px;
  font-size: 25px;
}

.fan {
  color: #777;
  font-size: 14px;
  margin-bottom: 20px;
}

.notice {
  margin: 15px 25px;
  padding: 12px;
  background: #fff4cc;
  border-radius: 10px;
  font-size: 13px;
  color: #665000;
}

.bio {
  padding: 0 30px;
  line-height: 1.5;
  color: #555;
}

.buttons {
  padding: 20px 25px;
}

.signal {
  display: block;
  padding: 16px;
  border-radius: 12px;
  background: #3a76f0;
  color: white;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
}

.signal:active {
  transform: scale(0.98);
}

.footer {
  padding: 25px;
  color: #999;
  font-size: 12px;
}
</style>
</head>
